<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        *{ margin:0; padding:0; font-family:'Times New Roman', Times, serif;}
        body{ background-image: url(K1.jpeg); background-repeat:no-repeat; background-position:center; background-attachment:fixed; background-size:cover;}
        h2 { color: aliceblue; }
        p{ color: aliceblue; }
        #btn{ font-size:23px; background-color:blue; padding:10px 40px; border-radius:10px;}
        form{ font-size:20px; border:3px solid black; width:310px; padding:60px; margin:200px auto; border-radius:10px; background-color: rgba(0,0,0,0.5);}
        input{ width:100%; padding:10px; border-radius:15px; margin-bottom:15px;}
        #errorMessage{ display:none; color:red; text-align:center; margin-top:15px; font-weight:bold;}
    </style>
</head>
<body>
<div class="container">
    <form id="loginForm">
        <h2>Login Page</h2><br>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="submit" id="btn">Login</button>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </form>
    <p id="errorMessage"></p>
</div>

<script>
const form = document.getElementById('loginForm');
const errorMessage = document.getElementById('errorMessage');

form.addEventListener('submit', function(event){
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "../backend/login.php", true);
    xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

    xhr.onload = function(){
        if(this.status === 200){
            const response = this.responseText.trim();
            if(response === "Login successful"){
                window.location.href = "index.html"; // redirect to dashboard
            } else {
                errorMessage.style.display = "block";
                errorMessage.textContent = response;
            }
        } else {
            alert("Server error: " + this.status);
        }
    };

    xhr.send(`email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
});
</script>
</body>
</html>
