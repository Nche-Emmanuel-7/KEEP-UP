<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        *{ margin:0; padding:0; font-family:'Times New Roman', Times, serif;}
        body{ background-image: url(K1.jpeg); background-repeat:no-repeat; background-position:center; background-attachment:fixed; background-size:cover;}
        h2 { color: aliceblue; }
        p{ color: aliceblue; }
        #btn{ font-size:23px; background-color:blue; padding:10px 40px; border-radius:10px;}
        form{ font-size:20px; border:3px solid black; width:310px; padding:60px; margin:200px auto; border-radius:10px; background-color: rgba(0,0,0,0.5);}
        input{ width:100%; padding:10px; border-radius:15px; margin-bottom:15px;}
        #successMessage{ display:none; color:green; text-align:center; margin-top:15px; font-weight:bold;}
    </style>
</head>
<body>
<div class="container">
    <form id="signupForm">
        <h2>Sign Up Page</h2><br>
        <input type="text" id="full_name" name="full_name" placeholder="Full Name" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit" id="btn">Sign Up</button>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </form>
    <p id="successMessage">Registration successful! Redirecting to login...</p>
</div>

<script>
const form = document.getElementById('signupForm');
const message = document.getElementById('successMessage');

form.addEventListener('submit', function(event){
    event.preventDefault(); // stop page reload

    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    if(password !== confirm_password){
        alert("Passwords do not match!");
        return;
    }

    const xhr = new XMLHttpRequest();
    // ✅ Corrected path to backend folder
    xhr.open("POST", "../backend/signup.php", true);
    xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

    xhr.onload = function(){
        if(this.status === 200){
            const response = this.responseText.trim();
            if(response === "Registration successful"){
                message.style.display = "block";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
            } else {
                alert(response);
            }
        } else {
            alert("Server error: " + this.status);
        }
    };

    xhr.send(`full_name=${encodeURIComponent(full_name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&confirm_password=${encodeURIComponent(confirm_password)}`);
});
</script>
</body>
</html>
